name: PR Intent Bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  extract-intent:
    name: Extract PR Intent from Checkpoints
    runs-on: ubuntu-latest
    steps:
      # Checkout with full history to access entire/checkpoints/v1 branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up Python for the extraction script
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Extract checkpoint data for the PR head commit
      - name: Extract checkpoint for PR head commit
        id: extract
        run: |
          python pr-intent-bridge/extract_checkpoint.py "${{ github.event.pull_request.head.sha }}" .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Output the extracted data for debugging / next steps
      - name: Show extracted checkpoint data
        run: |
          echo "=== Checkpoint Data ==="
          cat <<'EOF'
          ${{ steps.extract.outputs.result }}
          EOF

      # Post structured comment to PR
      - name: Post PR comment with intent summary
        if: steps.extract.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            // Find existing PR Intent Bridge comment to update
            const existing = comments.find(c => c.body.includes('PR Intent Bridge'));
            
            const result = JSON.parse('${{ steps.extract.outputs.result }}');
            const prompt_text = result.prompt_text || '';
            const files_touched = result.files_touched || [];
            const complete = result.complete || false;
            const format_version = result.format_version || 'unknown';
            const warnings = result.warnings || [];

            let body = `## 🔍 PR Intent Bridge\n\n`;
            body += `**Format Version:** ${format_version}\n`;
            body += `**Checkpoint Complete:** ${complete}\n\n`;

            if (prompt_text) {
              body += `### What Was Asked\n\`\`\`\n${prompt_text}\n\`\`\`\n\n`;
            } else {
              body += `### What Was Asked\n*No prompt text found in checkpoint*\n\n`;
            }

            if (files_touched.length > 0) {
              body += `### Files Touched\n`;
              for (const f of files_touched) {
                body += `- \`${f}\`\n`;
              }
              body += `\n`;
            } else {
              body += `### Files Touched\n*No files recorded*\n\n`;
            }

            if (warnings.length > 0) {
              body += `### Warnings\n`;
              for (const w of warnings) {
                body += `- ${w}\n`;
              }
              body += `\n`;
            }

            if (!complete) {
              body += `> ⚠️ Checkpoint data is incomplete. Some information may be missing.\n\n`;
            }

            body += `---\n*Generated by PR Intent Bridge from Entire checkpoint (format ${format_version})*`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      # TODO: Integrate LLM (Claude API) to analyze intent vs. actual diff
      # - name: Analyze intent vs diff with Claude
