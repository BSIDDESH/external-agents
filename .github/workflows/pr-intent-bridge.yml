name: PR Intent Bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  extract-intent:
    name: Extract PR Intent from Checkpoints
    runs-on: ubuntu-latest
    steps:
      # Checkout with full history to access entire/checkpoints/v1 branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up Python for the extraction script
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Extract checkpoint data for the PR head commit
      - name: Extract checkpoint for PR head commit
        id: extract
        run: |
          python pr-intent-bridge/extract_checkpoint.py "${{ github.event.pull_request.head.sha }}" .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Output the extracted data for debugging / next steps
      - name: Show extracted checkpoint data
        run: |
          echo "=== Checkpoint Data ==="
          cat <<'EOF'
          ${{ steps.extract.outputs.result }}
          EOF

